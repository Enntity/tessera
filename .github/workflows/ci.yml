name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
      - name: Tests
        run: swift test
      - name: Installer isolation and preservation
        run: python3 scripts/test-installer.py .build/debug/tessera-cli
      - name: Package local candidate
        run: scripts/package-release.sh --development
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-development-candidate
          path: .build/releases/Tessera-*
