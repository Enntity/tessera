name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan public source history
        run: |
          brew install gitleaks
          gitleaks git --redact --config .gitleaks.toml .
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
      - name: Tests
        run: swift test
      - name: Installer isolation and preservation
        run: python3 scripts/test-installer.py .build/debug/tessera-cli
      - name: Package local candidate
        run: scripts/package-release.sh --development
      - name: Verify extracted package and bundled installer
        run: |
          cd .build/releases
          shasum -a 256 -c Tessera-*.zip.sha256
          ditto -x -k Tessera-*.zip extracted
          codesign --verify --deep --strict extracted/Tessera.app
          cd ../..
          python3 scripts/test-installer.py .build/releases/extracted/Tessera.app/Contents/Helpers/tessera-cli
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-development-candidate
          path: .build/releases/Tessera-*
