name: TesseraIOS
options:
  bundleIdPrefix: org.enntity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Tessera:
    path: ../..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.9.0
targets:
  TesseraIOS:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Tessera
        product: TesseraKit
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.enntity.tessera.ios
        PRODUCT_NAME: Tessera
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Tessera
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Tessera connects to your Mac to show and control its tiles.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Sources/Info.plist
      properties:
        NSBonjourServices: [_tessera._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: org.enntity.tessera.pair
            CFBundleURLSchemes: [tessera]
